name: Keep backend awake

# Pings the Render backend so the free-tier service does not spin down (Render
# sleeps after ~15 min idle). Unlike a fixed-timeout uptime pinger, this retries
# through a cold start instead of failing the moment the first request is slow —
# which is why the external cron kept disabling itself.
#
# Runs on a public repo, so Actions minutes are free. The schedule can be delayed
# by GitHub under load, so we run every 10 min to stay well inside the 15-min
# sleep window even if a run slips a few minutes.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # lets you trigger a ping manually from the Actions tab

# If a slow run overruns into the next scheduled tick, skip rather than pile up.
concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health (retries through cold start)
        run: |
          curl -fsS \
            --max-time 120 \
            --retry 4 \
            --retry-delay 20 \
            --retry-all-errors \
            https://medivault-lp0g.onrender.com/health
          echo "\nBackend is awake."
