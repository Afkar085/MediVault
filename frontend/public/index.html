<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

    <!-- No maximum-scale / user-scalable=no: people need to pinch-zoom into a
         photographed prescription to read the small print, and blocking that is
         a WCAG 1.4.4 failure. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <meta name="theme-color" content="#001845" />
    <title>MediVault: your family's medical records in one place</title>
    <meta
      name="description"
      content="Keep your family's prescriptions, lab reports and hospital bills in one place. Photograph a document and MediVault reads the doctor, date, diagnosis and medicines for you, then lets you search or ask about them in plain language."
    />

    <!-- Update this if you deploy somewhere else; it drives the canonical URL
         and the link preview. -->
    <link rel="canonical" href="https://mymedivault.vercel.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MediVault" />
    <meta property="og:url" content="https://mymedivault.vercel.app/" />
    <meta property="og:title" content="MediVault: your family's medical records in one place" />
    <meta
      property="og:description"
      content="Photograph a prescription or lab report and MediVault reads the details for you. Search your family's medical history, or just ask."
    />
    <meta property="og:image" content="https://mymedivault.vercel.app/logo512.png" />
    <meta property="og:image:alt" content="The MediVault logo" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="MediVault: your family's medical records in one place" />
    <meta
      name="twitter:description"
      content="Photograph a prescription or lab report and MediVault reads the details for you."
    />
    <meta name="twitter:image" content="https://mymedivault.vercel.app/logo512.png" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MediVault" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Fonts are linked here rather than @imported from the stylesheet, so the
         browser finds them while the JS is still downloading. Inter is limited
         to the four weights the design uses, and the icon font is requested as
         a subset of the icons the app actually shows (the full variable icon
         font is several megabytes). Add a name to icon_names, alphabetically,
         when a new icon is used. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400..500,0..1,0&icon_names=add,add_a_photo,arrow_back,arrow_forward,assignment,auto_awesome,calendar_month,chat_bubble,check,check_circle,chevron_right,close,cloud_off,content_copy,delete_forever,description,download,edit,edit_note,error,event,event_busy,expand_less,expand_more,family_restroom,folder,forum,group,help,home,hourglass_top,info,lock,logout,medical_information,medication,note_add,person,person_add,person_remove,photo_camera,picture_as_pdf,receipt_long,schedule,science,search,search_off,stethoscope,task_alt,timeline,upload_file,visibility,visibility_off,zoom_in,zoom_out&display=block" />
  </head>
  <body>
    <noscript>
      MediVault needs JavaScript to show your records. Please enable it and reload the page.
    </noscript>
    <div id="root"></div>
  </body>
</html>
